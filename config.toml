# TECTONIC GLOBE 4.0
# Run: python -m pip install -r requirements.txt ; python terrain.py
# Every setting below is also live-editable from the viewer's settings panel
# (overrides persist to overrides.json; Reset restores this file).
# Distances below are METRES. Heights are relative to sea level.
# Save settings, STOP and RESTART Python. A changed planet setting rebuilds the
# small global guide maps; no change requires generating the planet at 1 m.
# Tectonics run once and are cached; zooming never reruns a billion years.

[viewer]
port = 8771
open_browser = true
start_longitude_degrees = 72.158203125
start_latitude_degrees = 14.501953125
view_width_metres = 23000000.0     # Orthographic span; globe diameter is 12,742 km.
min_view_width_metres = 160.0      # Around 0.1 m/pixel on a 1600-pixel display.
max_render_width = 1600           # Set to physical screen width for sharp pixels.
interactive_scale = 0.55          # Fewer pixels ONLY while moving, not different terrain.
settle_ms = 170
supersampling = 1                 # 1 or 2. 2 evaluates four times as many pixels.

[planet]
seed = 1973
radius_metres = 6371000.0         # Spherical mean Earth radius, not an ellipsoid.
# Emerged land is SOLVED: sea datum is trimmed post-erosion so exactly this
# fraction of the sphere sits above sea level (seed-robust). The implied water
# inventory is reported per world instead of forced. Fixed-volume solves left
# land at the mercy of each seed's collision history (25–35% observed).
emerged_land_target = 0.35
ocean_volume_km3 = 1050000000.0   # Deep-ocean inventory for the tectonic run's
                                  # snapshots. Sized so its natural emerged
                                  # fraction sits near the target below; the
                                  # final trim then stays a small correction
                                  # and implied volume lands nearby.
map_width = 2048                  # Global guide: width x width/2; NOT final resolution.
# Shared grown crust regions make continents; plate polygons NEVER each become islands.
# Landmasses are farthest-point seeds grown by flood fill with area budgeting
# (no noise field defines land). Budget is continental area incl. margins;
# emerged land after evolution + sea level is an output near ~35%.
continent_count = 5
continent_size_variety = 0.45      # 0 equal siblings, 1 spanning small isles to supercontinents.
continent_budget_fraction = 0.78   # 0.05–0.90 of sphere area claimed by continental crust.

[tectonics]
# FORWARD simulation of a synthetic planet from 1,000 Ma to the present.
# This does not reconstruct Earth's history or solve mantle convection.
# Initial plates are spherical Voronoi cells. Later boundaries are ADVECTED:
# they are never regenerated from moving Voronoi seeds.
duration_myr = 1000.0
mesh_subdivisions = 5             # 4: 2,562 cells; 5: 10,242; 6: 40,962.
# Mesh 5 resolves regional tectonics (~223 km), not individual mountain peaks.
# The fine terrain shaders still go down to metre scale, conditionally on it.
max_timestep_myr = 2.0            # Actual step is reduced to satisfy the CFL limit.
cfl = 0.30                       # 0.1–0.45; smaller is slower, not more detail.
plate_count = 12
# One entry broadcasts; otherwise one per INITIAL plate. Units are cm/year.
# 1 cm/year = 10 km/Myr. Subsequent rifts inherit their parent's properties.
plate_speed_cm_per_year = [4.0, 3.0, 5.5, 2.0, 6.0, 3.5, 4.5, 2.5, 5.0, 3.0, 6.5, 2.0]
initial_crust_thickness_km = [35.0, 38.0, 33.0, 36.0, 37.0, 34.0, 39.0, 35.0, 32.0, 36.0, 35.0, 37.0]
initial_ocean_age_myr = [5.0, 160.0]
# Smooth, prescribed changes in motion; not forces derived from mantle flow.
motion_epoch_myr = 200.0
motion_response_myr = 35.0
velocity_update_myr = 5.0
# Ages BEFORE PRESENT at which a large plate is split. Empty [] disables rifts.
# Material is inherited unchanged at the split; extension then thins margins,
# and newborn ocean crust fills spreading gaps. This is not a random new island.
rift_ages_myr = [900.0, 750.0, 600.0, 450.0, 300.0, 150.0]
rift_full_speed_cm_per_year = 3.5
breakup_crust_thickness_km = 13.0
# Continents that consume enough surface area in collision can suture. Surface
# crust volume is transferred/retained, not discarded with the absorbed label.
suture_check_interval_myr = 25.0
suture_consumed_area_fraction = 0.30
suture_memory_myr = 250.0
# AIRY ISOSTASY: continental elevation changes by (1-rho_crust/rho_mantle)*dH.
# Different average plate heights are an outcome of crust thickness/composition,
# not random additive offsets painted on plate polygons.
mantle_density_kg_m3 = 3300.0
continental_density_kg_m3 = 2800.0
oceanic_density_kg_m3 = 2900.0
water_density_kg_m3 = 1030.0
reference_crust_thickness_km = 35.0
reference_continent_elevation_metres = 1050.0
# Oceanic subsidence follows a finite-thickness conductive plate-cooling series.
thermal_plate_thickness_km = 125.0
thermal_diffusivity_km2_per_myr = 31.5576 # Equivalent to 1e-6 m²/s.
ridge_depth_metres = 3600.0
thermal_subsidence_metres = 3400.0
trench_depth_metres = 3200.0
boundary_reference_speed_cm_per_year = 5.0
# Magmatic addition is a parameterized fraction of consumed ocean-crust volume.
# Its volume is logged separately; this is not a thermochemical melting model.
arc_accretion_fraction = 0.16
arc_relaxation_myr = 280.0
# Gravitational spreading conserves crust volume within connected plate crust.
root_spreading_km2_per_myr = 5000.0
# Eroded excess roots enter an explicit unresolved sediment reservoir. The code
# reports this sink; it does not pretend to conserve crust while deleting it.
root_relaxation_myr = 150.0
# Extra roots relax faster as thickness grows: rate=(H/Href)^power / time.
# A reduced denudation/collapse law, not a calibrated mantle viscosity solver.
root_relaxation_thickness_power = 3.0
# Advected strain memories leave old belts behind after boundaries migrate.
compression_memory_myr = 420.0
extension_memory_myr = 180.0
shear_memory_myr = 220.0
compression_mask_strain = 0.27
extension_mask_strain = 0.18
shear_mask_strain = 0.7
deformation_width_km = 200.0
snapshot_interval_myr = 250.0       # Saved data only, no extra viewer controls.

[climate]
equator_temperature_c = 28.0
pole_temperature_drop_c = 48.0
lapse_c_per_km = 6.0
mean_rainfall_mm = 1200.0
# Trade-wind dry belts, wet equatorial belt and temperate storm belts share
# smooth fields; cells do not independently pick tropical or polar climates.
regional_temperature_variation_c = 4.0
regional_rainfall_variation = 0.8
rain_shadow_strength = 0.8

[hydrology]
# Entire spherical guide grid is routed to ocean with iterative Priority-Flood.
# Longitude wraps; both polar caps have explicit adjacency. Area uses latitude
# weighting. Coarse passes only FOLLOW gradients (no height carving); finer
# erosion octaves are increasingly steered by the baked downstream field.
enabled = true
routing_width = 1024              # Must divide planet.map_width. ~39 km at equator.
river_source_area_km2 = 80000.0     # Coarse major rivers, NOT local metre tributaries.
route_iterations = 3              # 1 = single pass (legacy); 2-5 refines flats/receivers.
refine_routing = true             # Second routing pass at planet.map_width for tributaries.
refine_source_area_km2 = 30000.0  # Tributary threshold for the refine pass (narrower banks).
max_river_records = 80000         # Largest-first cap; small streams ride shader gullies.
erosion_flow_gain = 0.45          # 0 disables steering; ~0.3-0.6 steers fine octaves.
coarse_follow_octaves = 3         # First N erosion octaves follow only (zero influence).
width_coefficient_metres = 0.8    # Half-width = coefficient * sqrt(area in km²).
maximum_half_width_metres = 1600.0
valley_width_metres = 14000.0
# Fine waterways are NOT raster-routed. They ride the shader's erosion steps:
# each displayed step that cuts a gully core carries surface water at that
# scale, so tributaries appear, merge and widen exactly as the ground refines.
# Onset/softness are in accumulated cut-state units: the coarsest erosion step
# contributes up to about 1 where it carves a gully core, finer steps add less
# (weight (amplitude/coarsest)^0.3) and a flat tile contributes zero.
gully_stream_onset = 0.20         # Channel strength where water starts to appear.
gully_stream_softness = 0.30      # Ramp width above the onset.
# The baked routing skeleton remains the global trunk; its water fades in on
# this footprint schedule instead of switching on at one fixed zoom level.
trunk_display_wavelength_metres = 24000.0
lake_minimum_depth_metres = 25.0
lake_maximum_depth_metres = 500.0
# Lakes are spill-level depressions in the global guide, not seeded circular bowls.

[fluvial]
# Map-stage stream-power geomorphology: graded valleys from tectonic uplift,
# deposition in lowlands, estuaries where trunks meet the sea. No noise.
enabled = true
strength = 0.35                 # 0 follow original heights, 1 full graded profiles.
grade = 0.035                   # Reference downstream slope at reference discharge.
discharge_reference_km2 = 5000.0
discharge_exponent = 0.5        # Slope scales as (Qref/Q)^exponent (theory: ~0.5).
deposition_metres = 150.0       # Cap on lowland aggradation toward the profile.
estuary_area_km2 = 25000.0      # Only large trunks overdeepen near the coast.
estuary_depth_metres = 150.0
diffusion_passes = 2            # Hillslope rounding passes (0–10).

[relief]
# Small landform relief sits INSIDE the global long mountain belts. Values are
# noise coefficients, not literal peak heights. Amplitudes are small on plains.
wavelength_metres = [80000, 23000, 7500, 2500, 800]
amplitude_metres = [1000, 1050, 680, 170, 30]
plain_fraction = 0.025
# Per-relief-layer influence of inherited collision, extension and shear fields.
# One entry broadcasts; N entries match wavelength_metres. These alter geometry,
# not only the colour. Stable plate interiors use plain_fraction.
collision_gain = [1.0]
rift_gain = [0.28]
transform_gain = [0.12]

[erosion]
# Runevision's fading-gully recurrence, adapted to three smoothly blended ECEF
# projections. It has no longitude seam or polar chart singularity. Original
# reference source is retained separately. These are vectorized parameters.
# Each array has either one entry (broadcast) or one entry per wavelength.
# Full terrain queries evaluate all layers. Display filters only accumulated
# height, NEVER the internal gully-direction recurrence.
wavelength_metres = [6200, 3100, 1550, 775, 387.5, 193.75, 96.875, 48.44, 24, 12, 6, 3, 1.5]
amplitude_metres = [950, 475, 237.5, 118.75, 59.375, 29.6875, 14.84, 7.42, 3.4, 1.6, 0.74, 0.35, 0.16]
gully_weight = [0.5]
detail = [1.5]
ridge_rounding = [0.075, 0.09, 0.105, 0.12, 0.12, 0.12, 0.1, 0.09, 0.08, 0.07, 0.055, 0.045, 0.035]
crease_rounding = [0.0]
onset = [1.25]
cell_scale = [0.7]
normalization = [0.5]
# Separate per-erosion-layer tectonic responses; independent of relief settings.
collision_gain = [1.0]
rift_gain = [0.35]
transform_gain = [0.12]
old_belt_rounding_multiplier = 1.7
assumed_slope = 0.7
initial_rounding_multiplier = 0.1
# Subpixel relief is filtered in presentation, not presented as equally bright
# individual mountain-sized tree/shadow spots at continental distances.

[dunes]
wavelength_metres = [500, 160, 45, 12, 3]
amplitude_metres = [24, 6, 1.2, 0.22, 0.025]
wind_degrees = 25.0
maximum_slope_degrees = 9.0

[ecology]
tree_slope_degrees = [24.0, 43.0]  # Full forest below first, no forest above second.
rock_slope_degrees = [27.0, 52.0]
snow_temperature_c = [-9.0, -1.0] # Full to none; also suppress snow on near-vertical rock.

[appearance]
# Muted reflectance colours. No extra high-contrast outline around every gully.
# These approximate natural land cover, not photographs or cultivated land.
ocean_deep = [0.065, 0.16, 0.31]
ocean_shallow = [0.13, 0.37, 0.43]
forest = [0.17, 0.28, 0.18]
grass = [0.36, 0.41, 0.25]
desert = [0.68, 0.57, 0.41]
rock = [0.47, 0.43, 0.37]
snow = [0.86, 0.88, 0.86]
lake = [0.07, 0.23, 0.24]
# Google-Earth-style bathymetric tint, NOT an optical view through deep seawater.
bathymetry = true
hillshade_strength = 0.45
canopy_cell_metres = 11.0
canopy_height_metres = 14.0
# Fixed world-size reflectance patterns, averaged away before they become aliasing.
surface_wavelength_metres = [150000, 40000, 10000, 3200, 600, 120, 25, 5, 1]
surface_colour_strength = [0.12, 0.15, 0.13, 0.10, 0.09, 0.07, 0.09, 0.10, 0.035]
