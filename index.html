<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tectonic Globe 4.0</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070c;color:#e5e9ed;font:13px system-ui, sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.box{position:absolute;background:#102020df;border:1px solid #94aaaa28;border-radius:3px;padding:10px 12px;pointer-events:none}#brand{top:10px;left:10px}#brand strong{font-size:14px}#brand small{display:block;margin-top:5px;color:#b5c5c6}#buttons{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:2px}#buttons button{width:36px;height:36px;border:1px solid #d9e3df35;background:#112424dd;color:white;font-size:21px;cursor:pointer}#home{font-size:11px}#status{bottom:12px;right:12px;font-size:11px}#scale{bottom:13px;left:12px;padding:0;background:none;border:0;font-size:11px;text-shadow:0 1px 2px black}#bar{height:4px;border:1px solid white;border-top:0;margin-top:4px}#error{display:none;left:15%;top:35%;width:65%;white-space:pre-wrap;background:#3c1818ee;pointer-events:auto}#loading{left:50%;top:50%;transform:translate(-50%,-50%);max-width:75%}
#overlays{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:2px;max-width:60vw;overflow-x:auto;padding:3px;background:#102020cc;border:1px solid #94aaaa28;border-radius:3px}#overlays button{border:1px solid transparent;background:transparent;color:#c6d4d4;font-size:11px;padding:4px 8px;cursor:pointer;white-space:nowrap}#overlays button:hover{background:#1d3535}#overlays button.active{background:#2a4a4a;border-color:#7fb3b3;color:#fff}#overlayCap{position:absolute;top:46px;left:50%;transform:translateX(-50%);font-size:11px;color:#b5c5c6;text-shadow:0 1px 2px #000;pointer-events:none;white-space:nowrap}
#panel{position:absolute;top:64px;left:10px;bottom:56px;width:302px;display:flex;flex-direction:column;background:#0e1c1cf2;border:1px solid #94aaaa33;border-radius:4px;pointer-events:auto}#panel.hidden{display:none}#panelHead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #94aaaa22;font-weight:600}#panelHead button{background:none;border:1px solid #94aaaa33;color:#c6d4d4;cursor:pointer;border-radius:3px;font-size:13px;padding:0 8px}#tabs{display:flex;border-bottom:1px solid #94aaaa22}#tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:#9db5b5;font-size:11px;padding:7px 0;cursor:pointer}#tabs button.active{color:#fff;border-bottom-color:#7fb3b3}#controls{flex:1;overflow-y:auto;padding:6px 10px 10px}.ctl{margin:7px 0}.ctl label{display:flex;align-items:center;gap:6px;font-size:12px}.ctl .help{font-size:10.5px;color:#8ba3a3;margin:2px 0 0 14px}.ctl input[type=range]{flex:1;min-width:0}.ctl input[type=number]{width:76px;background:#0a1414;border:1px solid #94aaaa33;color:#e5e9ed;border-radius:3px;padding:2px 4px;font-size:12px}.ctl input[type=text]{width:100%;box-sizing:border-box;background:#0a1414;border:1px solid #94aaaa33;color:#e5e9ed;border-radius:3px;padding:3px 5px;font-size:12px}.ctl input[type=color]{width:34px;height:22px;border:1px solid #94aaaa33;background:none;padding:0}.ctl input[type=checkbox]{accent-color:#7fb3b3}.ctl select{background:#0a1414;border:1px solid #94aaaa33;color:#e5e9ed;border-radius:3px;padding:2px 4px;font-size:12px}.ctl .row{display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;flex:none}.dot.instant{background:#6f6}.dot.rebundle{background:#fc3}.dot.rebuild{background:#f66}.arrRow{display:flex;gap:6px;align-items:center;margin:3px 0}.arrRow input[type=range]{flex:1;min-width:0}.arrRow input[type=number]{width:64px}.arrRow .idx{font-size:10px;color:#8ba3a3;width:22px;flex:none}.miniBtn{background:#16292a;border:1px solid #94aaaa33;color:#c6d4d4;border-radius:3px;cursor:pointer;font-size:11px;padding:1px 7px}#panelFoot{border-top:1px solid #94aaaa22;padding:8px 10px}#panelFoot .btnRow{display:flex;gap:6px}#applyBtn{flex:1;background:#2a5a5a;border:1px solid #7fb3b3;color:#fff;border-radius:3px;padding:7px;cursor:pointer;font-size:13px}#applyBtn:disabled{background:#1a2c2c;border-color:#94aaaa28;color:#7d9494;cursor:default}#applyBtn.rebuild{background:#6b3030;border-color:#c77}#resetBtn{background:none;border:1px solid #94aaaa33;color:#9db5b5;border-radius:3px;padding:7px 10px;cursor:pointer}#tierLegend{display:flex;gap:10px;font-size:10.5px;color:#8ba3a3;margin-bottom:7px}#jobBar{margin-top:8px;font-size:11px}#jobTrack{height:6px;background:#0a1414;border:1px solid #94aaaa28;border-radius:3px;margin:5px 0}#jobFill{height:100%;width:0;background:#7fb3b3;border-radius:2px}#panelError{display:none;margin-top:7px;font-size:11px;color:#f0a8a8;white-space:pre-wrap}#expand{position:absolute;top:64px;left:10px;background:#0e1c1cf2;border:1px solid #94aaaa33;color:#c6d4d4;border-radius:4px;cursor:pointer;font-size:15px;padding:6px 10px}
@media(max-width:760px){#panel{width:262px}#overlays{max-width:94vw}}
</style></head><body><canvas id="map" aria-label="Procedurally generated globe; drag to rotate and scroll to zoom"></canvas><div class="box" id="brand"><strong>Tectonic Globe 4.0</strong><small>6,371 km radius · drag to rotate · scroll to zoom</small></div><div id="buttons"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="home" aria-label="Show globe">Globe</button></div><div class="box" id="scale"><span id="scaleText"></span><div id="bar"></div></div><div class="box" id="status">Loading globe…</div><div class="box" id="loading">Loading the global guide and compiling the terrain shaders…</div><div class="box" id="error"></div><div id="overlays" role="tablist" aria-label="Map overlays"></div><div id="overlayCap"></div><button id="expand" hidden>» settings</button><div id="panel"><div id="panelHead"><span>World settings</span><button id="collapse" aria-label="Collapse panel">«</button></div><div id="tabs"></div><div id="controls"></div><div id="panelFoot"><div id="tierLegend"><span><span class="dot instant"></span> live</span><span><span class="dot rebundle"></span> apply</span><span><span class="dot rebuild"></span> regenerate</span></div><div class="btnRow"><button id="applyBtn" disabled>No changes</button><button id="resetBtn" title="Delete local overrides, back to config.toml">Reset</button></div><div id="jobBar" hidden><span id="jobStage">queued</span><div id="jobTrack"><div id="jobFill"></div></div><button id="jobCancel" class="miniBtn">Cancel build</button></div><div id="panelError"></div></div></div><script src="viewer.js"></script><script>
'use strict';
(async()=>{
const errBox=document.getElementById('panelError');
const showError=m=>{errBox.style.display=m?'block':'none';errBox.textContent=m||'';};
async function api(method,path,body){
 let r;
 try{r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});}
 catch(e){throw new Error('Server unreachable. Is python terrain.py running?');}
 let j=null;try{j=await r.json();}catch(e){}
 if(!r.ok)throw new Error((j&&j.error)||('HTTP '+r.status));
 return j;
}
const CAP=['Natural land cover with hillshade','Height: black −5 km … white +6 km','White land · black ocean · cyan fresh water','Temperature: −45 °C purple … +45 °C red','Rainfall: dry brown … wet blue (log scale)','Orogenic ruggedness 0 … 1','Strain: R compression · G extension · B shear','Ocean age: cyan young … dark old (0 … 250 Myr)','Continental crust thickness 0 … 70 km','Rivers: cyan water · blue upstream accumulation','One colour per tectonic plate (dim = ocean)'];
let schema,server,W;
try{schema=(await api('GET','/api/schema')).schema;server=await api('GET','/api/settings');}
catch(e){showError(String(e.message||e));return;}
W=JSON.parse(JSON.stringify(server.values));
const byTab={};schema.forEach(e=>{(byTab[e.tab]=byTab[e.tab]||[]).push(e);});
const TABS=Object.keys(byTab);let tab=TABS[0];
const deepEq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const getP=(s,k)=>W[s]&&W[s][k];
const setP=(s,k,v)=>{W[s]=W[s]||{};W[s][k]=v;};
function dirtyPaths(){const out=[];for(const e of schema){if(!deepEq(getP(e.section,e.key),server.values[e.section][e.key]))out.push(e);}return out;}
// overlay bar
const names=(window.globe&&window.globe.overlayNames)?window.globe.overlayNames():CAP.map((_,i)=>'M'+i);
const obar=document.getElementById('overlays'),cap=document.getElementById('overlayCap');
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=(i<10?i+' ':'')+n;b.title=CAP[i]||n;b.onclick=()=>setOv(i);obar.appendChild(b);});
function setOv(i){if(!window.globe||!window.globe.ready){setTimeout(()=>setOv(i),300);return;}window.globe.setOverlay(i);syncOv();}
let ovNames=false;
function syncOv(){const i=window.globe.getOverlay();if(!ovNames&&window.globe.overlayNames){const ns=window.globe.overlayNames();obar.querySelectorAll('button').forEach((el,j)=>{el.textContent=(j<10?j+' ':'')+ns[j];el.title=CAP[j]||ns[j];});ovNames=true;}obar.querySelectorAll('button').forEach((el,j)=>el.classList.toggle('active',j===i));cap.textContent=CAP[i]||'';}
setOv(0);setInterval(()=>{if(window.globe&&window.globe.ready)syncOv();},1500);
// panel collapse
const panel=document.getElementById('panel'),expand=document.getElementById('expand');
document.getElementById('collapse').onclick=()=>{panel.classList.add('hidden');expand.hidden=false;};
expand.onclick=()=>{panel.classList.remove('hidden');expand.hidden=true;};
// tabs
const tabsEl=document.getElementById('tabs'),ctlEl=document.getElementById('controls');
TABS.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{tab=t;renderTabs();renderControls();};tabsEl.appendChild(b);});
function renderTabs(){tabsEl.querySelectorAll('button').forEach(el=>el.classList.toggle('active',el.textContent===tab));}
function rgb2hex(v){const h=x=>Math.round(Math.max(0,Math.min(1,x))*255).toString(16).padStart(2,'0');return '#'+h(v[0])+h(v[1])+h(v[2]);}
function hex2rgb(s){return [parseInt(s.slice(1,3),16)/255,parseInt(s.slice(3,5),16)/255,parseInt(s.slice(5,7),16)/255];}
function plateLen(){const n=W.tectonics&&W.tectonics.plate_count;return (typeof n==='number'&&n>=1)?n|0:12;}
function listLen(e){const v=getP(e.section,e.key);if(!Array.isArray(v))return 0;return v.length;}
function renderControls(){
 ctlEl.innerHTML='';
 for(const e of byTab[tab]){
  const wrap=document.createElement('div');wrap.className='ctl';
  const lab=document.createElement('label');
  const dot=document.createElement('span');dot.className='dot '+e.tier;dot.title=e.tier;lab.appendChild(dot);
  const nm=document.createElement('span');nm.textContent=e.label;lab.appendChild(nm);wrap.appendChild(lab);
  const val=getP(e.section,e.key);
  const commit=v=>{setP(e.section,e.key,v);onEdit(e);};
  if(e.kind==='bool'){
   const c=document.createElement('input');c.type='checkbox';c.checked=!!val;c.onchange=()=>commit(c.checked);lab.prepend(c);
  }else if(e.kind==='enum'){
   const s=document.createElement('select');e.options.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;if(o===val)op.selected=true;s.appendChild(op);});
   s.onchange=()=>commit(s.value.includes('.')?parseFloat(s.value):parseInt(s.value,10));wrap.appendChild(s);
  }else if(e.kind==='color'){
   const c=document.createElement('input');c.type='color';c.value=rgb2hex(val);
   c.oninput=()=>commit(hex2rgb(c.value));wrap.appendChild(c);
  }else if(e.kind==='textlist'){
   const t=document.createElement('input');t.type='text';t.value=(val||[]).join(', ');
   t.onchange=()=>{const parts=t.value.split(',').map(s=>s.trim()).filter(s=>s.length);const nums=parts.map(Number);
    if(nums.some(x=>!isFinite(x))){showError(e.label+': comma-separated numbers only.');renderControls();return;}
    showError('');commit(nums);normalizeAssociates(e,nums.length);renderControls();};
   wrap.appendChild(t);
  }else if(e.kind==='floatlist'){
   const n=e.len==='plate'?plateLen():(typeof e.len==='number'?e.len:listLen(e));
   let arr=Array.isArray(val)?val.slice():[];
   while(arr.length<n)arr.push(arr.length?arr[arr.length-1]:0);
   arr=arr.slice(0,Math.max(n,1));
   arr.forEach((x,i)=>{
    const row=document.createElement('div');row.className='arrRow';
    const ix=document.createElement('span');ix.className='idx';ix.textContent=e.len==='plate'?(i+1):('#'+(i+1));row.appendChild(ix);
    const r=document.createElement('input');r.type='range';r.min=e.min;r.max=e.max;r.step=e.step||'any';r.value=x;
    const num=document.createElement('input');num.type='number';num.min=e.min;num.max=e.max;num.step=e.step||'any';num.value=x;
    r.oninput=()=>{num.value=r.value;};
    const done=()=>{let v=parseFloat(num.value);if(!isFinite(v))v=x;const cp=arr.slice();cp[i]=v;commit(e.len==='plate'?cp.slice(0,plateLen()):cp);};
    r.onchange=()=>{num.value=r.value;done();};num.onchange=done;
    row.appendChild(r);row.appendChild(num);wrap.appendChild(row);
   });
  }else{ // float / int
   const row=document.createElement('div');row.className='row';
   const r=document.createElement('input');r.type='range';r.min=e.min;r.max=e.max;r.step=e.step||'any';r.value=val;
   const num=document.createElement('input');num.type='number';if(e.min!==undefined)num.min=e.min;if(e.max!==undefined)num.max=e.max;num.step=e.step||'any';num.value=val;
   r.oninput=()=>{num.value=r.value;if(e.tier==='instant')preview(e,parseFloat(r.value));};
   r.onchange=()=>{commit(e.kind==='int'?Math.round(parseFloat(num.value)):parseFloat(num.value));};
   num.onchange=()=>{let v=parseFloat(num.value);if(!isFinite(v))v=val;r.value=v;commit(e.kind==='int'?Math.round(v):v);};
   row.appendChild(r);row.appendChild(num);wrap.appendChild(row);
  }
  if(e.help){const h=document.createElement('div');h.className='help';h.textContent=e.help;wrap.appendChild(h);}
  ctlEl.appendChild(wrap);
 }
 refreshButton();
}
// keep associate broadcast-lists consistent when a wavelength root changes length
function normalizeAssociates(e,n){
 const groups={relief:['amplitude_metres','collision_gain','rift_gain','transform_gain'],erosion:['amplitude_metres','gully_weight','detail','ridge_rounding','crease_rounding','onset','cell_scale','normalization','collision_gain','rift_gain','transform_gain'],dunes:['amplitude_metres'],appearance:['surface_colour_strength']};
 const g=groups[e.section];if(!g||e.key!=='wavelength_metres'&&e.key!=='surface_wavelength_metres')return;
 for(const k of g){
  const v=getP(e.section,k);if(!Array.isArray(v)||v.length===n||v.length<=1)continue;
  const cp=v.slice(0,n);while(cp.length<n)cp.push(cp[cp.length-1]);setP(e.section,k,cp);
 }
 if(e.section==='tectonics')return;
}
let instantTimer=null;
function persistInstant(e){
 clearTimeout(instantTimer);
 instantTimer=setTimeout(async()=>{try{await api('POST','/api/settings',{settings:{viewer:{[e.key]:getP(e.section,e.key)}}});server=await api('GET','/api/settings');}catch(err){showError(String(err.message||err));}},900);
}
function preview(e,v){
 setP(e.section,e.key,v);
 try{window.globe.setConfig({viewer:{[e.key]:v}});}catch(err){}
 refreshButton();persistInstant(e);
}
function onEdit(e){
 showError('');
 if(e.tier==='instant'){try{window.globe.setConfig({viewer:{[e.key]:getP(e.section,e.key)}});}catch(err){}persistInstant(e);}
 if(e.section==='tectonics'&&e.key==='plate_count'){renderControls();return;}
 refreshButton();
}
const applyBtn=document.getElementById('applyBtn');
function refreshButton(){
 const d=dirtyPaths();
 let tier='instant';
 for(const e of d){if(e.tier==='rebuild'){tier='rebuild';break;}if(e.tier==='rebundle')tier='rebundle';}
 if(!d.length){applyBtn.disabled=true;applyBtn.textContent='No changes';applyBtn.classList.remove('rebuild');}
 else if(tier==='rebuild'){applyBtn.disabled=false;applyBtn.textContent=`Regenerate world (${d.length} change${d.length>1?'s':''})`;applyBtn.classList.add('rebuild');}
 else if(tier==='rebundle'){applyBtn.disabled=false;applyBtn.textContent=`Apply (${d.length})`;applyBtn.classList.remove('rebuild');}
 else{applyBtn.disabled=true;applyBtn.textContent='Live ✓';applyBtn.classList.remove('rebuild');}
}
const jobBar=document.getElementById('jobBar'),jobFill=document.getElementById('jobFill'),jobStage=document.getElementById('jobStage');
let polling=false;
async function pollJob(id){
 polling=true;jobBar.hidden=false;applyBtn.disabled=true;
 document.getElementById('jobCancel').onclick=async()=>{try{await api('DELETE','/api/jobs/'+id);}catch(e){}};
 try{
  for(;;){
   const j=await api('GET','/api/jobs/'+id);
   jobFill.style.width=(100*(j.progress||0)).toFixed(1)+'%';
   jobStage.textContent=(j.stage||j.state)+' '+Math.round(100*(j.progress||0))+'%';
   if(j.state==='done')break;
   if(j.state==='error'||j.state==='cancelled')throw new Error(j.state==='cancelled'?'Build cancelled.':('Build failed: '+(j.error||'unknown'))); 
   await new Promise(r=>setTimeout(r,600));
  }
  await window.globe.reloadWorld();
  server=await api('GET','/api/settings');W=JSON.parse(JSON.stringify(server.values));renderControls();
 }catch(e){showError(String(e.message||e));}
 polling=false;jobBar.hidden=true;refreshButton();
}
applyBtn.onclick=async()=>{
 showError('');
 const d=dirtyPaths();if(!d.length)return;
 const settings={};
 for(const e of d){(settings[e.section]=settings[e.section]||{})[e.key]=getP(e.section,e.key);}
 const needRebuild=d.some(e=>e.tier==='rebuild');
 applyBtn.disabled=true;applyBtn.textContent=needRebuild?'Starting build…':'Applying…';
 try{
  const r=await api('POST','/api/settings',{settings,rebuild:needRebuild});
  if(r.action==='rebuild'&&r.job){pollJob(r.job);return;}
  await window.globe.reloadWorld();
  server=await api('GET','/api/settings');W=JSON.parse(JSON.stringify(server.values));renderControls();
 }catch(e){
  if(e.message&&e.message.includes('already running')){
   showError('A build is already running — pick up its progress after it finishes.');
  }else showError(String(e.message||e));
  try{server=await api('GET','/api/settings');W=JSON.parse(JSON.stringify(server.values));renderControls();}catch(_){}
 }
 refreshButton();
};
document.getElementById('resetBtn').onclick=async()=>{
 showError('');
 try{
  const r=await api('DELETE','/api/settings');
  if(r.tier==='rebuild'){const j=await api('POST','/api/settings',{settings:{},rebuild:true});if(j.job){pollJob(j.job);return;}}
  await window.globe.reloadWorld();
  server=await api('GET','/api/settings');W=JSON.parse(JSON.stringify(server.values));renderControls();
 }catch(e){showError(String(e.message||e));}
};
renderTabs();renderControls();refreshButton();
})();
</script></body></html>
