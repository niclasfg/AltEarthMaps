<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tectonic Globe 4.0</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070c;color:#e5e9ed;font:13px system-ui, sans-serif}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.box{position:absolute;background:#102020df;border:1px solid #94aaaa28;border-radius:3px;padding:10px 12px;pointer-events:none}#brand{top:10px;left:10px}#brand strong{font-size:14px}#brand small{display:block;margin-top:5px;color:#b5c5c6}#buttons{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:2px}button{width:36px;height:36px;border:1px solid #d9e3df35;background:#112424dd;color:white;font-size:21px;cursor:pointer}#home{font-size:11px}#status{bottom:12px;right:12px;font-size:11px}#scale{bottom:13px;left:12px;padding:0;background:none;border:0;font-size:11px;text-shadow:0 1px 2px black}#bar{height:4px;border:1px solid white;border-top:0;margin-top:4px}#error{display:none;left:15%;top:35%;width:65%;white-space:pre-wrap;background:#3c1818ee;pointer-events:auto}#loading{left:50%;top:50%;transform:translate(-50%,-50%);max-width:75%}
</style></head><body><canvas id="map" aria-label="Procedurally generated globe; drag to rotate and scroll to zoom"></canvas><div class="box" id="brand"><strong>Tectonic Globe 4.0</strong><small>6,371 km radius · drag to rotate · scroll to zoom</small></div><div id="buttons"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="home" aria-label="Show globe">Globe</button></div><div class="box" id="scale"><span id="scaleText"></span><div id="bar"></div></div><div class="box" id="status">Loading globe…</div><div class="box" id="loading">Loading the global guide and compiling the terrain shaders…</div><div class="box" id="error"></div><script src="viewer.js"></script></body></html>
